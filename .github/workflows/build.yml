name: Compilar APK Offline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar el código del proyecto
        uses: actions/checkout@v4

      - name: 2. Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 4. Instalar dependencias
        run: npm install

      - name: 5. Organizar estructura web para Capacitor
        run: |
          mkdir -p www
          # Movemos los archivos web a la carpeta www manteniendo carpetas como base_de_conocimiento e icons
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'node_modules' ! -name 'package.json' ! -name 'package-lock.json' -exec mv {} www/ \;

      - name: 6. Crear configuración de Capacitor
        run: |
          echo '{
            "appId": "cultiva.maria.app",
            "appName": "marIA",
            "webDir": "www",
            "bundledWebRuntime": false
          }' > capacitor.config.json

      - name: 7. Añadir plataforma Android y compilar
        run: |
          npx cap add android
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - name: 8. Subir el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: marIA-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
